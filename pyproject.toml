[project]
name = "dvah"
version = "0.3.0"
description = "Damn Vulnerable Agent Harness — patch-the-runtime security lab for AI agent platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
services = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
anthropic = [
    "anthropic>=0.39",
]
openai = [
    "openai>=1.40",
]
bedrock = [
    "boto3>=1.34",
]
# All model backends at once.
models = [
    "anthropic>=0.39",
    "openai>=1.40",
    "boto3>=1.34",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
]

[project.scripts]
dvah = "dvah.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvah"]

[tool.pytest.ini_options]
# e2e is deselected by default so it never runs in CI. Run it manually with:
#   uv run pytest tests/e2e -m e2e
addopts = "-m 'not e2e'"
# Default collection is the tests/ tree only. Challenge suites are run explicitly
# with a path (e.g. `dvah test DVAH-001`), which overrides this.
testpaths = ["tests"]
markers = [
    "unit: isolated single-module tests",
    "integration: multi-component tests through the loader/harness",
    "e2e: end-to-end over real HTTP services (manual only, excluded from CI)",
    "functional: legitimate tasks must still work",
    "exploit: the known attack must fail to violate the invariant",
    "invariant: property test over generated actions",
    "adversarial: hidden mutations, run only under --adversarial",
]
filterwarnings = [
    # FastAPI/Starlette TestClient emits an upstream StarletteDeprecationWarning about httpx
    # at import time; matched by message so the category/module don't matter. Not ours to fix.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
branch = false
# Omit code that cannot execute under the CI unit+integration gate by design (documented
# in CLAUDE.md: e2e/live-model paths stay out of CI). Each needs an external SDK, a live
# server, a subprocess child context, or a real model key — exercised only by e2e/live runs.
omit = [
    "dvah/providers/anthropic_model.py",   # vendor SDK (lazy import), live-only
    "dvah/providers/openai_model.py",      # vendor SDK (lazy import), live-only
    "dvah/providers/bedrock_model.py",     # vendor SDK (lazy import), live-only
    "dvah/providers/http_tools.py",        # needs the live FastAPI services (e2e-only)
    "dvah/providers/mcp_stub.py",          # MCP subprocess child entrypoint
    "dvah/webapi/tutor.py",                # needs a live model API key
    "dvah/webapi/_pytest_report.py",       # pytest plugin loaded in the sandboxed subprocess
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",              # Protocol/abstract method stubs
    "@(abc\\.)?abstractmethod",
]
