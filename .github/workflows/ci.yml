name: dvah-ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Nothing here needs write scope.
permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # PRs run untrusted code (the harness executes arbitrary lab Python in tests) — bound it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Create an explicit 3.12 venv and install INTO it (uv run uses the same .venv).
      - name: Set up Python 3.12.3
        run: uv python install 3.12.3
      - name: Create venv
        run: uv venv --python 3.12.3
      - name: Install (dev + services + web)
        run: uv pip install -e ".[dev,services,web]"

      # Unit + integration. e2e is excluded by the default `-m 'not e2e'` addopts.
      - name: Unit and integration tests
        run: .venv/bin/python -m pytest tests/ -m "unit or integration" -q

      # Prove every challenge's REFERENCE solution passes its own suite.
      # (The shipped vulnerable code intentionally fails; CI never runs it.)
      - name: Challenge reference solutions
        run: |
          for dir in challenges/*/; do
            echo "=== $dir (solution) ==="
            .venv/bin/python -m pytest "$dir/evals" -q \
              -m "functional or exploit or invariant or adversarial" \
              --challenge="$dir" --solution
          done

      - name: Conformance (builtin adapter — all invariants must hold)
        run: .venv/bin/dvah conformance --adapter builtin

      - name: Coverage gate (dvah package)
        run: |
          .venv/bin/python -m pytest tests/ -m "unit or integration" \
            --cov=dvah --cov-report=term-missing --cov-fail-under=100 -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      # Vitest component tests. Playwright e2e is manual-only (npm run e2e), excluded here.
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build
